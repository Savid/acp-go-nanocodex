[package]
name = "acp-go-nanocodex-native"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"

[dependencies]
nanocodex = { git = "https://github.com/gakonst/nanocodex", rev = "ef6e62ef492f5eef3eee17eab6bced9c6b29947e", default-features = false, features = ["openai", "tools"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = "1"
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "rustls-no-provider"] }
tower = { version = "0.5", features = ["util"] }
eventsource-stream = "0.2"
httpdate = "1"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["net", "process"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[build-dependencies]
sha2 = "0.10"
